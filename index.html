<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Typhoon Live Preview</title>
<style>
  body { margin:0; display:flex; height:100vh; background:#111; color:#eee; font-family:sans-serif; }
  #sidebar { width:320px; background:#1a1a1a; padding:14px; overflow-y:auto; border-right:1px solid #333; }
  #map { flex:1; }
  h1 { margin:0 0 10px; font-size:18px; }
  .section-title { margin-top:12px; border-bottom:1px solid #444; padding-bottom:3px; font-size:14px; }
  .info-line { font-size:13px; margin:3px 0; }
  .forecast-item { font-size:12px; margin:2px 0; }
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<div id="sidebar">
  <h1>Typhoon Live</h1>
  <div id="typhoonName">台風情報取得中...</div>
  <div id="announceTime"></div>

  <div class="section-title">現在の中心位置</div>
  <div id="centerPos" class="info-line"></div>
  <div id="windArea" class="info-line"></div>
  <div id="stormArea" class="info-line"></div>

  <div class="section-title">予報経路</div>
  <div id="forecastList"></div>

  <div class="info-line" id="timestamp"></div>
</div>

<div id="map"></div>

<script>
// ------------------------
// 地図初期化
// ------------------------
const map = L.map("map").setView([30, 135], 5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
const layer = L.layerGroup().addTo(map);

// ------------------------
// 気象庁 API（台風情報）
// ------------------------
// 公式： https://www.jma.go.jp/bosai/typhoon/data/TC.json
// ここから「最新の台風ID」を取得 → 詳細を取得して描画

async function loadTyphoon() {
  try {
    // 最新台風一覧
    const listRes = await fetch("https://www.jma.go.jp/bosai/typhoon/data/TC.json");
    const listJson = await listRes.json();

    if (!listJson || listJson.length === 0) {
      document.getElementById("typhoonName").textContent = "現在台風は存在しません";
      return;
    }

    // 最新の台風IDを取得
    const latest = listJson[listJson.length - 1];
    const id = latest.typhoonId;

    // 台風詳細データ
    const detailRes = await fetch(`https://www.jma.go.jp/bosai/typhoon/data/${id}.json`);
    const detailJson = await detailRes.json();

    render(detailJson);
  } catch (e) {
    console.error(e);
    document.getElementById("typhoonName").textContent = "台風情報の取得に失敗しました";
  }
}

// ------------------------
// サイドバー描画
// ------------------------
function render(data) {
  const info = data.info[0]; // 最新時刻の情報
  const forecasts = data.forecast;

  document.getElementById("typhoonName").textContent =
    `台風 ${data.typhoonNumber}号（${data.typhoonName}）`;

  document.getElementById("announceTime").textContent =
    `発表: ${info.date}`;

  document.getElementById("centerPos").textContent =
    `中心位置: 北緯${info.lat}° 東経${info.lon}°`;

  document.getElementById("windArea").textContent =
    `強風域: 約${info.radiusStrong}km`;

  document.getElementById("stormArea").textContent =
    `暴風域: 約${info.radiusStorm}km`;

  const list = document.getElementById("forecastList");
  list.innerHTML = "";
  forecasts.forEach(f => {
    const div = document.createElement("div");
    div.className = "forecast-item";
    div.textContent = `${f.date} → 北緯${f.lat}° 東経${f.lon}°`;
    list.appendChild(div);
  });

  document.getElementById("timestamp").textContent =
    `更新: ${new Date().toLocaleString("ja-JP")}`;

  drawMap(info, forecasts);
}

// ------------------------
// 地図描画
// ------------------------
function drawMap(info, forecasts) {
  layer.clearLayers();

  const center = [info.lat, info.lon];

  // 中心位置
  layer.addLayer(L.circleMarker(center, {
    radius: 6, color: "#ff0000", fillColor: "#ff5555", fillOpacity: 0.9
  }).bindPopup("台風中心"));

  // 強風域
  layer.addLayer(L.circle(center, {
    radius: info.radiusStrong * 1000,
    color: "#ffcc00", fillColor: "#ffcc00", fillOpacity: 0.15
  }));

  // 暴風域
  layer.addLayer(L.circle(center, {
    radius: info.radiusStorm * 1000,
    color: "#ff0000", fillColor: "#ff0000", fillOpacity: 0.2
  }));

  // 進路線
  const points = [center, ...forecasts.map(f => [f.lat, f.lon])];
  const line = L.polyline(points, { color:"#fff", weight:2, dashArray:"4,4" });
  layer.addLayer(line);

  // 予報点
  forecasts.forEach(f => {
    layer.addLayer(L.circleMarker([f.lat, f.lon], {
      radius:4, color:"#fff", fillColor:"#fff", fillOpacity:0.8
    }).bindPopup(f.date));
  });

  map.fitBounds(line.getBounds(), { padding:[20,20] });
}

// 実行
loadTyphoon();
</script>
</body>
</html>
